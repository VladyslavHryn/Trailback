    <!-- Fraunces for display: a high-contrast old-style serif with SOFT and
         WONK axes, which is what keeps it from reading as a stock serif —
         it carries the "archive / atlas" register this product is about.
         Instrument Sans handles body copy, IBM Plex Mono the data labels
         (coordinates, counts, axis ticks). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=Instrument+Sans:wght@400..600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

      name="description"
      content="Trailback аналізує всю історію місцезнаходжень Google Takeout за раз і показує інсайти, яких немає в Google Timeline."
    />
