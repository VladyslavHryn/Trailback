<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts are SELF-HOSTED (see the @fontsource imports in src/index.css),
         not fetched from Google's CDN, for two independent reasons:

         1. CORRECTNESS. The previous faces here — Fraunces and Instrument
            Sans — have no Cyrillic glyphs at all. Every Ukrainian word in this
            UI, which is all of them, silently fell back to the browser's
            default serif and system sans. The typography that shipped was
            therefore Georgia + system-ui, i.e. no chosen typeface at all.

         2. PRIVACY. This product's whole promise is that the file never
            leaves the browser. A stylesheet link to fonts.googleapis.com
            hands Google the visitor's IP and referrer on every single load —
            a third-party request on the one screen that claims there are
            none. Serving the woff2 from our own origin removes it. -->
    <title>Trailback — карта твоєї геоісторії</title>
    <meta
      name="description"
      content="Trailback аналізує всю історію місцезнаходжень Google Takeout за раз і показує інсайти, яких немає в Google Timeline."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
